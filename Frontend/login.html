<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShopFlow</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5; /* Indigo */
            --primary-hover: #4338ca;
            --secondary-bg: #f3f4f6;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --input-focus-ring: rgba(79, 70, 229, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .split-layout {
            height: 100vh;
            display: flex;
        }

        /* Left Side - Visual */
        .visual-side {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            position: relative;
            display: none; /* Hidden on mobile by default */
        }

        @media (min-width: 992px) {
            .visual-side {
                display: block;
            }
        }

        .visual-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 4rem;
            color: white;
        }

        .visual-quote {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .visual-author {
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* Right Side - Form */
        .form-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 2rem;
            overflow-y: auto;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-text h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .header-text p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Custom Form Controls */
        .form-floating-custom {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .form-control-modern {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background-color: #fafafa;
            color: var(--text-dark);
        }

        .form-control-modern:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--input-focus-ring);
            background-color: #fff;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control-modern:focus + .input-icon {
            color: var(--primary-color);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .btn-primary-modern {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary-color);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary-modern:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-primary-modern:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 1rem;
        }

        .social-btn {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-weight: 500;
            color: var(--text-dark);
            transition: all 0.2s;
            margin-bottom: 0.75rem;
        }

        .social-btn:hover {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        /* Alert Styling */
        .custom-alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideDown 0.3s ease-out;
        }

        .alert-success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .forgot-link {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Spinner */
        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.15em;
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <!-- Left Side: Visual/Brand -->
        <div class="visual-side">
            <div class="visual-overlay">
                <div>
                    <p class="visual-quote">"Welcome back! Continue your shopping journey where you left off."</p>
                    <p class="visual-author">ShopFlow Team</p>
                </div>
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="form-side">
            <div class="form-container">
                <div class="brand-logo">
                    <i class="fa-solid fa-bag-shopping"></i> ShopFlow
                </div>

                <div class="header-text mb-4">
                    <h1>Welcome back</h1>
                    <p>Enter your credentials to access your account.</p>
                </div>

                <div id="alert-container"></div>

                <form id="loginForm">
                    <!-- Username -->
                    <div class="form-floating-custom">
                        <input type="text" class="form-control-modern" id="username" placeholder="Username" required>
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>

                    <!-- Password -->
                    <div class="form-floating-custom">
                        <input type="password" class="form-control-modern" id="password" placeholder="••••••••" required minlength="6">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fa-regular fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>

                    <div class="form-options">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe" style="font-size: 0.875rem; color: var(--text-muted);">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary-modern" id="submitBtn">
                        <span>Sign In</span>
                    </button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button class="social-btn">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                    Sign in with Google
                </button>

                <div class="footer-link">
                    Don't have an account? <a href="register.html">Sign up</a>
                </div>
                
                <div class="text-center mt-4" style="font-size: 0.75rem; color: #9ca3af;">
                    &copy; 2026 ShopFlow Inc. All rights reserved.
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Load auth.js FIRST -->
    <script src="auth.js"></script>

    <!-- Inline script LAST -->
    <script>
        // UI Logic
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // 🛡️ FALLBACK: Define showAlert if auth.js failed
        if (typeof showAlert !== 'function') {
            console.warn("⚠️ showAlert not found in auth.js - using fallback");
            window.showAlert = function(message, type) {
                const container = document.getElementById('alert-container');
                if (!container) return;
                
                const icon = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>';
                
                container.innerHTML = `
                    <div class="custom-alert alert-${type}">
                        ${icon}
                        <div>${message}</div>
                    </div>
                `;
                
                // Auto dismiss after 5 seconds
                setTimeout(() => {
                    const alertEl = container.querySelector('.custom-alert');
                    if(alertEl) {
                        alertEl.style.opacity = '0';
                        setTimeout(() => alertEl.remove(), 300);
                    }
                }, 5000);
            };
        }

        console.log("🔍 Login script loaded | showAlert available:", typeof showAlert === 'function');

        // Auth check
        if (typeof window.redirectIfAuthenticated === 'function') {
            window.redirectIfAuthenticated();
        } else if (typeof redirectIfAuthenticated === 'function') {
            redirectIfAuthenticated();
        } else {
            console.warn("⚠️ redirectIfAuthenticated not found - skipping auth check");
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("📤 Form submitted");
            
            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;
            btn.disabled = true; 
            btn.innerHTML = `<div class="spinner-border spinner-border-sm text-light" role="status"></div> Logging in...`;

            try {
                // 🛡️ Fallback for AUTH_API if not defined
                const API_URL = typeof AUTH_API !== 'undefined' 
                    ? AUTH_API 
                    : (window.AUTH_API || 'https://auth.didin.in/api/auth');
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                const res = await fetch(`${API_URL}/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json().catch(() => ({}));
                console.log("📡 Response:", res.status, data);

                if (res.ok && data.access) {
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh || '');
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    // 🚀 Immediate redirect
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                    
                } else {
                    const errorMsg = data.detail || data.error || data.non_field_errors || 'Invalid credentials';
                    showAlert(errorMsg, 'danger');
                    
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                }
            } catch (err) {
                console.error("💥 Login error:", err);
                showAlert('Network error: ' + err.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        });
    </script>
</body>
</html>
